# MySQL local para desenvolvimento (opcional). Uso: docker compose up -d
services:
  mysql:
    image: mysql:8.0
    container_name: agendamento-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: agendamento_dev   # somente desenvolvimento local
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./database/mysql:/docker-entrypoint-initdb.d:ro   # executa 01, 02 e 03 na criação
      - mysql-dados:/var/lib/mysql
volumes:
  mysql-dados:
